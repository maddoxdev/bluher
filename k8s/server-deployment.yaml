apiVersion: apps/v1
kind: Deployment
metadata:
  name: voip-server
  namespace: voip
spec:
  replicas: 3
  selector:
    matchLabels:
      app: voip-server
  template:
    metadata:
      labels:
        app: voip-server
    spec:
      containers:
      - name: voip-server
        image: voip-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Host=postgres;Database=voipdb;Username=postgres;Password=postgres"
        - name: ConnectionStrings__Redis
          value: "redis:6379"
        - name: Jwt__Key
          value: "VoipServer-Secret-Key-Min-32-Characters-Required-For-Production"
        - name: Jwt__Issuer
          value: "VoipServer"
        - name: Jwt__Audience
          value: "VoipClient"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: voip-server
  namespace: voip
spec:
  selector:
    app: voip-server
  type: LoadBalancer
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voip-server-hpa
  namespace: voip
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voip-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
