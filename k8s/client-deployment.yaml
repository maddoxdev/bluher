apiVersion: apps/v1
kind: Deployment
metadata:
  name: voip-client
  namespace: voip
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voip-client
  template:
    metadata:
      labels:
        app: voip-client
    spec:
      containers:
      - name: voip-client
        image: voip-client:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: voip-client
  namespace: voip
spec:
  selector:
    app: voip-client
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
